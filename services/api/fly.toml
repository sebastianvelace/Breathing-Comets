app = "breathing-comets-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SPX_DATA_DIR = "/data"
  SPX_ALLOWED_ORIGINS = "https://breathingcomets.org,https://www.breathingcomets.org,http://localhost:5173"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/v1/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

[mounts]
  source = "spx_cache"
  destination = "/data"
