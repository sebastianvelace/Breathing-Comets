[project]
name = "breathing-comets"
version = "0.1.0"
description = "SPHEREx sky images, time-domain exploration and forced photometry"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "astropy==8.0.2",
    "astroquery==0.4.11",
    "cdshealpix==0.9.0",
    "duckdb==2.0.0",
    "fastapi==0.162.0",
    "granian==2.8.6",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "obstore==0.12.1",
    "orjson==3.13.0",
    "pyarrow==26.0.0",
    "pydantic==2.14.1",
    "pyvo==1.10.0",
    "reproject==0.21.0",
    "scipy==1.18.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["packages/spxcore", "."]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: reads real public mission data",
    "slow: acceptance checks with longer execution time",
]
